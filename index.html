<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TV Colombia</title>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif; /* Using Inter font */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column; /* Allow content to stack vertically */
        }
        #iniciar {
            font-size: 1.5em;
            background: none;
            border: 2px solid white;
            padding: 1em 2em;
            color: white;
            cursor: pointer;
            border-radius: 10px; /* Rounded corners */
            transition: background-color 0.3s, color 0.3s, transform 0.2s;
        }
        #iniciar:hover {
            background-color: white;
            color: black;
            transform: scale(1.05);
        }
        #tv-container {
            display: none;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative; /* For absolute positioning of controls */
            overflow: hidden; /* Ensure content doesn't spill out */
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensure video fits within the player without cropping */
            pointer-events: auto; /* Allow interaction with the video element itself if needed for VJS controls */
        }
        #controls-overlay, #channel-info {
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
            opacity: 1;
            visibility: visible;
        }
        #controls-overlay.hidden, #channel-info.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none; /* Disable interaction when hidden */
        }
        #controls-overlay {
            position: absolute;
            bottom: 20px;
            width: 90%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap; /* Allow controls to wrap on smaller screens */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .control-button {
            background: #333;
            border: none;
            color: white;
            padding: 12px 20px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1; /* Distribute space evenly */
            min-width: 120px; /* Ensure buttons don't get too small */
        }
        .control-button:hover {
            background-color: #555;
            transform: translateY(-2px);
        }
        .control-button i {
            font-size: 1.3em;
        }
        #channel-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.4em;
            font-weight: bold;
            text-align: center;
            white-space: nowrap; /* Prevent wrapping */
            overflow: hidden; /* Hide overflow */
            text-overflow: ellipsis; /* Add ellipsis if text overflows */
            max-width: 80%; /* Limit width on smaller screens */
        }
        #channel-selector {
            display: flex;
            gap: 5px;
            align-items: center;
            margin-top: 10px; /* Space from other controls */
            flex-basis: 100%; /* Take full width in the flex container */
            justify-content: center;
        }
        #channel-input {
            width: 80px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #222;
            color: white;
            font-size: 1em;
            text-align: center;
        }
        #go-channel-btn {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 1em;
        }
        #go-channel-btn:hover {
            background-color: #0056b3;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #iniciar {
                font-size: 1.2em;
                padding: 0.8em 1.5em;
            }
            #controls-overlay {
                flex-direction: row; /* Keep row direction for controls */
                bottom: 10px;
                padding: 10px;
                width: 95%;
            }
            .control-button {
                font-size: 1em;
                padding: 10px 15px;
                min-width: unset; /* Remove min-width to allow more flexibility */
                flex: 1; /* Distribute space evenly */
            }
            #channel-info {
                font-size: 1.1em;
                top: 10px;
                max-width: 90%;
            }
            #channel-selector {
                flex-direction: column; /* Stack input and button on small screens */
            }
            #channel-input {
                width: 100%; /* Full width for input on small screens */
                margin-bottom: 5px; /* Space between input and button */
            }
            #go-channel-btn {
                width: 100%; /* Full width for button on small screens */
            }
        }
    </style>
</head>

        // Función para cargar canales desde la cadena de contenido M3U
        async function loadChannels() {
            const lines = m3uContent.split('\n'); // Dividir el contenido en líneas individuales

            let channelName = '';
            lines.forEach(line => {
                if (line.startsWith('#EXTINF')) {
                    // Extraer el nombre del canal de la línea #EXTINF
                    const match = line.match(/,(.*)$/);
                    if (match) channelName = match[1].trim();
                } else if (line.startsWith('http') && line.includes('.m3u8')) {
                    // Si es una URL y termina con .m3u8, añadirla al array de canales
                    channels.push({ name: channelName, url: line.trim() });
                }
            });

            if (channels.length > 0) {
                // Empezar a reproducir el primer canal si se encuentran canales
                playChannel(currentChannelIndex);
            } else {
                iniciarBtn.textContent = 'No se encontraron canales válidos.';
            }
        }

        // Función para mostrar la superposición de controles y la información del canal, y establecer un temporizador para ocultarlos
        function showControls() {
            clearTimeout(controlsTimeout); // Limpiar cualquier temporizador existente
            controlsOverlay.classList.remove('hidden');
            channelInfoDisplay.classList.remove('hidden');

            // Establecer un nuevo temporizador para ocultar los controles después de 3 segundos de inactividad
            controlsTimeout = setTimeout(() => {
                controlsOverlay.classList.add('hidden');
                channelInfoDisplay.classList.add('hidden');
            }, 3000); // 3 segundos
        }

        // Función para reproducir un canal específico por su índice
        function playChannel(index) {
            // Asegurarse de que el índice esté dentro de los límites del array de canales
            if (index < 0) {
                index = channels.length - 1; // Volver al último canal
            } else if (index >= channels.length) {
                index = 0; // Volver al primer canal
            }
            currentChannelIndex = index; // Actualizar el índice del canal actual global

            const channel = channels[currentChannelIndex];
            if (channel) {
                player.src({ src: channel.url, type: 'application/x-mpegURL' });
                player.muted(false); // Asegurarse de que el audio no esté silenciado
                player.play()
                    .then(() => {
                        // Actualizar la visualización de la información del canal con el número y nombre del canal
                        channelInfoDisplay.textContent = `Canal: ${currentChannelIndex + 1} - ${channel.name}`;
                        console.log(`Reproduciendo: ${channel.name} (${channel.url})`);
                        showControls(); // Mostrar controles después de cambiar de canal
                    })
                    .catch(error => {
                        // Manejar el rechazo de la promesa de reproducción (por ejemplo, se requiere un gesto del usuario)
                        console.warn('La reproducción fue interrumpida o falló (puede necesitar un gesto del usuario):', error);
                        channelInfoDisplay.textContent = `Canal: ${currentChannelIndex + 1} - ${channel.name} (Error al reproducir)`;
                        // Si la reproducción automática falla, es posible que el usuario tenga que hacer clic en reproducir manualmente o interactuar
                        // El oyente de errores a continuación manejará los errores reales de los medios para saltar
                        showControls(); // Seguir mostrando controles para indicar error
                    });
            } else {
                console.warn(`No se encontró ningún canal en el índice: ${index}`);
                channelInfoDisplay.textContent = 'No hay canal disponible.';
                showControls(); // Mostrar controles si no hay canal disponible
            }
        }

        // Oyente de eventos para errores de reproducción de video (por ejemplo, transmisión no disponible)
        player.on('error', () => {
            console.error('Error al reproducir el canal actual. Saltando al siguiente...');
            channelInfoDisplay.textContent = `Canal: ${currentChannelIndex + 1} - ${channels[currentChannelIndex]?.name} (Error)`;
            // Incrementar el índice y probar el siguiente canal
            currentChannelIndex = (currentChannelIndex + 1) % channels.length;
            playChannel(currentChannelIndex);
        });

        // --- Funciones de control de volumen ---
        function volumeUp() {
            let currentVolume = player.volume();
            if (currentVolume < 1) {
                player.volume(Math.min(1, currentVolume + 0.1)); // Aumentar en 10%, máximo 1
            }
            console.log('Volumen:', player.volume());
            showControls(); // Mostrar controles cuando cambia el volumen
        }

        function volumeDown() {
            let currentVolume = player.volume();
            if (currentVolume > 0) {
                player.volume(Math.max(0, currentVolume - 0.1)); // Disminuir en 10%, mínimo 0
            }
            console.log('Volumen:', player.volume());
            showControls(); // Mostrar controles cuando cambia el volumen
        }

        // --- Funciones de cambio de canal ---
        function nextChannel() {
            playChannel(currentChannelIndex + 1);
            console.log('Siguiente canal...');
        }

        function prevChannel() {
            playChannel(currentChannelIndex - 1);
            console.log('Canal anterior...');
        }

        // --- Función de selección directa de canal ---
        function selectChannel() {
            const channelNumber = parseInt(channelInput.value, 10);
            if (isNaN(channelNumber) || channelNumber < 1 || channelNumber > channels.length) {
                channelInfoDisplay.textContent = `Número de canal inválido. Ingrese un número entre 1 y ${channels.length}.`;
                console.warn('Número de canal inválido ingresado:', channelInput.value);
                showControls(); // Mostrar controles para mostrar el mensaje de error
                return;
            }
            playChannel(channelNumber - 1); // Ajustar para el índice basado en 0
            channelInput.value = ''; // Limpiar la entrada después de la selección
        }


        // --- Oyentes de eventos para nuevos controles ---
        volUpBtn.addEventListener('click', volumeUp);
        volDownBtn.addEventListener('click', volumeDown);
        nextChannelBtn.addEventListener('click', nextChannel);
        prevChannelBtn.addEventListener('click', prevChannel);
        goChannelBtn.addEventListener('click', selectChannel);
        // Permitir presionar Enter en el campo de entrada para seleccionar el canal
        channelInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                selectChannel();
            }
        });

        // Oyentes de eventos para mostrar controles en la interacción del usuario
        tvContainer.addEventListener('mousemove', showControls);
        tvContainer.addEventListener('touchend', showControls);

        // Deshabilitar el comportamiento predeterminado de clic para reproducir/pausar de Video.js en el elemento de video
        player.ready(function() {
            this.off('click'); // Elimina el controlador de clic predeterminado en el elemento del reproductor
            // Si el usuario aún quiere controlar la reproducción/pausa a través del área de video,
            // necesitarían un botón o un gesto específico.
            // Por ahora, los clics en el área de video no alternarán la reproducción/pausa.
        });


        // Controlador de clic inicial del botón 'Iniciar'
        iniciarBtn.addEventListener('click', async () => {
            iniciarBtn.style.display = 'none'; // Ocultar el botón de inicio
            tvContainer.style.display = 'flex'; // Mostrar el contenedor de TV

            await loadChannels(); // Cargar canales una vez que el usuario haga clic

            // Solicitar pantalla completa para el elemento de video
            const videoEl = document.querySelector('video');
            if (videoEl.requestFullscreen) {
                videoEl.requestFullscreen();
            } else if (videoEl.webkitRequestFullscreen) { /* Safari */
                videoEl.webkitRequestFullscreen();
            } else if (videoEl.mozRequestFullScreen) { /* Firefox */
                videoEl.mozRequestFullScreen();
            } else if (videoEl.msRequestFullscreen) { /* IE11 */
                videoEl.msRequestFullscreen();
            }
            showControls(); // Mostrar controles inicialmente después de iniciar
        });

        // Opcional: Controles de teclado para mayor comodidad
        document.addEventListener('keydown', (event) => {
            if (tvContainer.style.display === 'flex') { // Solo activo cuando la TV está visible
                switch (event.key) {
                    case 'ArrowUp':
                        volumeUp();
                        break;
                    case 'ArrowDown':
                        volumeDown();
                        break;
                    case 'ArrowRight':
                        nextChannel();
                        break;
                    case 'ArrowLeft':
                        prevChannel();
                        break;
                    case ' ': // Barra espaciadora para reproducir/pausar (aún permitida por teclado)
                        if (player.paused()) {
                            player.play();
                        } else {
                            player.pause();
                        }
                        showControls(); // Mostrar controles al usar el teclado para reproducir/pausar
                        break;
                }
            }
        });
    </script>
</body>
</html>
